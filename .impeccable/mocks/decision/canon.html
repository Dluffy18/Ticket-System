<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#F3F4F6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111827}
.bar{background:#1D4ED8;color:#fff;padding:18px 16px;font-size:19px;font-weight:600}
main{padding:16px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.k{font-size:13px;color:#6B7280}
.num{font-size:44px;font-weight:700;margin:6px 0;color:#1D4ED8}
.meta{display:flex;gap:16px;font-size:14px;color:#374151;margin-top:8px}
.go{display:block;width:100%;margin-top:16px;background:#1D4ED8;color:#fff;border:0;border-radius:24px;font-size:17px;font-weight:600;padding:15px 0}
.sub{font-size:13px;color:#6B7280;margin-top:8px;text-align:center}
h2{font-size:16px;margin:22px 0 10px}
.row{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:15px}
.pill{font-size:12px;background:#DCFCE7;color:#166534;padding:3px 10px;border-radius:99px}
.tabs{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #E5E7EB;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#6B7280}
.tabs .on{color:#1D4ED8;font-weight:600}
</style></head><body>
<div class="bar">Violation Ticketing</div>
<main>
 <div class="card">
  <div class="k">Traffic · Booklet 18104550–18104600</div>
  <div class="num">#18104558</div>
  <div class="k">Write this number on your Traffic form</div>
  <div class="meta"><span>Used: 8</span><span>Left: 43</span></div>
 </div>
 <button class="go">Start citation</button>
 <p class="sub">Spoiled form or wrong number? Start, then Cancel or report it on Review.</p>
 <h2>Today</h2>
 <div class="row"><span>#18104557 · 10:42</span><span class="pill">Done</span></div>
 <div class="row"><span>#18104556 · 10:15</span><span class="pill">Done</span></div>
 <div class="row"><span>#18104555 · 09:51</span><span class="pill">Done</span></div>
</main>
<div class="tabs"><span class="on">Home</span><span>Type</span><span>Citations</span><span>Stats</span><span>Profile</span></div>
</body></html>
